<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Result viewer</title>
  <style>
    :root{color-scheme:light dark;font:13px/1.45 var(--font-sans,system-ui,sans-serif)}body{margin:0;padding:14px;color:var(--color-text-primary,CanvasText);background:var(--color-background-primary,Canvas)}.head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:10px}h3,h4{margin:0}h3{font-size:15px}h4{font-size:13px;margin:12px 0 6px}.muted{opacity:.65}.box{border:1px solid var(--color-border-primary,color-mix(in srgb,CanvasText 18%,transparent));border-radius:9px;overflow:auto;max-height:520px}table{border-collapse:collapse;width:100%;font-size:12px}th,td{padding:7px 9px;text-align:left;border-bottom:1px solid var(--color-border-secondary,color-mix(in srgb,CanvasText 12%,transparent));vertical-align:top;max-width:360px;overflow-wrap:anywhere}th{position:sticky;top:0;background:var(--color-background-primary,Canvas);font-weight:600}dl{display:grid;grid-template-columns:minmax(110px,25%) 1fr;margin:0}dt,dd{padding:7px 9px;border-bottom:1px solid var(--color-border-secondary,color-mix(in srgb,CanvasText 12%,transparent));margin:0}dt{font-weight:600}.empty{padding:24px;text-align:center}.pill{font-size:11px;border:1px solid currentColor;border-radius:99px;padding:2px 7px;opacity:.7}.section{padding:0 9px 9px}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;padding:9px;border-bottom:1px solid var(--color-border-secondary,color-mix(in srgb,CanvasText 12%,transparent))}.summary div{padding:7px;border:1px solid var(--color-border-secondary,color-mix(in srgb,CanvasText 12%,transparent));border-radius:7px}.summary small{display:block;opacity:.65}.summary strong{font-size:14px}.note{padding:7px 9px;border-bottom:1px solid var(--color-border-secondary,color-mix(in srgb,CanvasText 12%,transparent))}
  </style>
</head>
<body>
  <div class="head"><h3 id="title">Result</h3><span class="pill" id="count">Waiting</span></div>
  <div class="box" id="view" aria-live="polite"><div class="empty muted">Waiting for results…</div></div>
  <script>
    const mode="__FRAX_VIEW_MODE__", appName=__FRAX_APP_NAME__, view=document.querySelector("#view"), title=document.querySelector("#title"), count=document.querySelector("#count");
    const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    const display=v=>v&&typeof v==="object"?JSON.stringify(v):v;
    function normalize(result){let value=result?.structuredContent;if(value==null){const text=result?.content?.find(x=>x.type==="text")?.text;try{value=JSON.parse(text)}catch{value={data:text}}}return value??{}}
    function render(result){const root=normalize(result), data=root.data??root.result??root, rows=Array.isArray(data)?data:(Array.isArray(root.rows)?root.rows:null);if(rows){renderTable(rows,root);return}if(data&&typeof data==="object"){renderDetail(data);return}title.textContent="Result";view.innerHTML=`<div class="empty">${esc(data)}</div>`;count.textContent="1 value";resize()}
    function renderTable(rows,root){const columns=columnNames(rows,root), prefix=summaryMarkup(root);title.textContent=mode==="report"?"Report result":"Document results";count.textContent=`${rows.length} row${rows.length===1?"":"s"}`;view.innerHTML=prefix+(rows.length?`<table><thead><tr>${columns.map(c=>`<th>${esc(c.label)}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${columns.map(c=>`<td>${esc(display(Array.isArray(r)?r[c.index]:r?.[c.key]))}</td>`).join("")}</tr>`).join("")}</tbody></table>`:`<div class="empty muted">No rows</div>`);resize()}
    function summaryMarkup(root){const summary=root?.meta?.report_summary, warnings=root?.warnings;let html="";if(Array.isArray(summary)&&summary.length)html+=`<div class="summary">${summary.map(item=>`<div><small>${esc(item.label??item.title??"")}</small><strong>${esc(display(item.value??item))}</strong></div>`).join("")}</div>`;if(Array.isArray(warnings))html+=warnings.map(item=>`<div class="note">${esc(item.message??item)}</div>`).join("");return html}
    function columnNames(rows,root){const configured=root?.meta?.columns;if(Array.isArray(configured)&&configured.length)return configured.slice(0,30).map((c,index)=>typeof c==="string"?{key:c,label:c,index}:{key:c.fieldname??c.name??String(index),label:c.label??c.fieldname??c.name??String(index),index});const keys=[...new Set(rows.flatMap(r=>r&&typeof r==="object"&&!Array.isArray(r)?Object.keys(r):[]))].slice(0,30);if(keys.length)return keys.map((key,index)=>({key,label:key,index}));return Array.from({length:Math.min(30,Math.max(0,...rows.map(r=>Array.isArray(r)?r.length:0)))},(_,index)=>({key:String(index),label:String(index+1),index}))}
    function renderDetail(data){title.textContent=data.doctype||"Document detail";const scalar=Object.entries(data).filter(([,v])=>!Array.isArray(v)&&(!v||typeof v!=="object")), children=Object.entries(data).filter(([,v])=>Array.isArray(v));count.textContent=data.name||`${scalar.length} fields`;const fields=`<dl>${scalar.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>`;const tables=children.map(([name,rows])=>`<div class="section"><h4>${esc(name)}</h4>${tableMarkup(rows)}</div>`).join("");view.innerHTML=fields+tables;resize()}
    function tableMarkup(rows){if(!rows.length)return`<div class="muted">No rows</div>`;const columns=columnNames(rows,{});return`<table><thead><tr>${columns.map(c=>`<th>${esc(c.label)}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${columns.map(c=>`<td>${esc(display(Array.isArray(r)?r[c.index]:r?.[c.key]))}</td>`).join("")}</tr>`).join("")}</tbody></table>`}
    function send(message){parent.postMessage(message,"*")}
    function resize(){send({jsonrpc:"2.0",method:"ui/notifications/size-changed",params:{height:Math.min(document.documentElement.scrollHeight,620)}})}
    addEventListener("message",event=>{if(event.source!==parent)return;const message=event.data||{};if(message.id===1&&message.result){send({jsonrpc:"2.0",method:"ui/notifications/initialized"});resize()}if(message.method==="ui/notifications/tool-result")render(message.params);if(message.method==="ui/resource-teardown")send({jsonrpc:"2.0",id:message.id,result:{}})});
    send({jsonrpc:"2.0",id:1,method:"ui/initialize",params:{protocolVersion:"2026-01-26",appInfo:{name:`${appName} result viewer`,version:"1.0.0"},appCapabilities:{availableDisplayModes:["inline","fullscreen"]}}});
  </script>
</body>
</html>
